<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <style>
        /* Simple styling to make it look nice */
        body { font-family: sans-serif; max-width: 500px; margin: 50px auto; text-align: center; }
        input { padding: 10px; width: 70%; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        ul { list-style: none; padding: 0; margin-top: 20px; text-align: left; }
        li { background: #f9f9f9; border-bottom: 1px solid #eee; padding: 10px; display: flex; justify-content: space-between; }
        .delete-btn { background-color: #dc3545; font-size: 0.8em; padding: 5px 10px; margin-left: 10px; }
    </style>
</head>
<body>

    <h1>📝 My Task Manager</h1>
    
    <div>
        <input type="text" id="taskInput" placeholder="What do you need to do?">
        <button onclick="createTask()">Add Task</button>
    </div>

    <ul id="taskList">
        </ul>

    <script>
        // When opened locally (file:// or localhost) we talk to the dev server;
        // when served from a real host (Netlify) we talk to the deployed backend.
        // After deploying the backend, replace the placeholder below with your
        // Render URL (must be https:// to avoid mixed-content blocking).
        const LOCAL_HOSTS = ["", "127.0.0.1", "localhost"];
        const API_BASE = LOCAL_HOSTS.includes(window.location.hostname)
            ? "http://127.0.0.1:8000"
            : "https://REPLACE-WITH-RENDER-URL.onrender.com";
        const API_URL = `${API_BASE}/tasks`;

        // 1. Function to Get Tasks from Python
        async function loadTasks() {
            const response = await fetch(API_URL);
            const tasks = await response.json();

            const list = document.getElementById("taskList");
            list.innerHTML = ""; // Clear list before rebuilding

            tasks.forEach(task => {
                // Build nodes via the DOM API instead of innerHTML — using
                // template strings with ${task.title} is an XSS vector if a
                // title ever contains markup like "<img src=x onerror=alert(1)>".
                const li = document.createElement("li");

                const span = document.createElement("span");
                span.textContent = task.title;

                const btn = document.createElement("button");
                btn.className = "delete-btn";
                btn.textContent = "Delete";
                btn.addEventListener("click", () => deleteTask(task.id));

                li.appendChild(span);
                li.appendChild(btn);
                list.appendChild(li);
            });
        }

        // 2. Function to Add a Task
        async function createTask() {
            const input = document.getElementById("taskInput");
            const text = input.value;
            
            if (!text) return; // Don't send empty tasks

            await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title: text })
            });

            input.value = ""; // Clear box
            loadTasks(); // Refresh list
        }

        // 3. Function to Delete a Task
        async function deleteTask(id) {
            await fetch(`${API_URL}/${id}`, { method: "DELETE" });
            loadTasks();
        }

        // Load tasks immediately when page opens
        loadTasks();
    </script>

</body>
</html>
